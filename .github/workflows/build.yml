name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Extract Flutter project FIRST
      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ZIP..."

          if [ ! -f "photo_enhancer_4k.zip" ]; then
            echo "::error::photo_enhancer_4k.zip was not found."
            exit 1
          fi

          rm -rf photo_enhancer_4k

          unzip -q photo_enhancer_4k.zip -d .

          if [ ! -f "photo_enhancer_4k/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml was not found."
            echo "ZIP contents:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Flutter project extracted successfully."


      # 3. Setup Java AFTER extraction
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # 5. Show versions
      - name: Show tool versions
        run: |
          flutter --version
          java -version


      # 6. Generate Android platform if missing
      - name: Generate Android platform
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            echo "android/ does not exist."
            echo "Generating Android platform..."

            flutter create \
              --platforms=android \
              --org com.lahan \
              --project-name photo_enhancer_4k \
              .
          else
            echo "android/ already exists."
          fi


      # 7. Configure Android safely
      - name: Configure Android
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Enable multidex
          if "multiDexEnabled = true" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        multiDexEnabled = true",
                  1
              )

          # Enable core library desugaring
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          # Add desugaring dependency
          dependency = (
              '    coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n" + dependency,
                      1
                  )
              else:
                  s += (
                      "\n\ndependencies {\n"
                      + dependency
                      + "\n}\n"
                  )

          p.write_text(s)
          PY


      # 8. Get Flutter dependencies
      - name: Flutter Pub Get
        working-directory: photo_enhancer_4k
        run: flutter pub get


      # 9. Analyze
      - name: Flutter Analyze
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true


      # 10. Tests
      - name: Flutter Test
        working-directory: photo_enhancer_4k
        run: flutter test


      # 11. Clean
      - name: Flutter Clean
        working-directory: photo_enhancer_4k
        run: flutter clean


      # 12. Get dependencies again after clean
      - name: Flutter Pub Get Again
        working-directory: photo_enhancer_4k
        run: flutter pub get


      # 13. Build Release APKs
      - name: Build Release APK
        working-directory: photo_enhancer_4k
        run: |
          flutter build apk \
            --release \
            --split-per-abi


      # 14. Upload APKs
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apks
          path: |
            photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
