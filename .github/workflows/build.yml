name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "photo_enhancer_4k.zip" ]; then
            echo "::error::photo_enhancer_4k.zip not found."
            exit 1
          fi

          rm -rf photo_enhancer_4k
          unzip -q photo_enhancer_4k.zip -d .

          test -f photo_enhancer_4k/pubspec.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: photo_enhancer_4k
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org com.lahan \
              --project-name photo_enhancer_4k \
              .
          fi

      - name: Configure Android JVM
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          # Use Flutter's temporary compatibility mode for
          # projects/plugins that have not fully migrated to
          # AGP 9 built-in Kotlin yet.
          cat >> android/gradle.properties <<'EOF'

          android.newDsl=false
          android.builtInKotlin=false
          EOF

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Remove deprecated kotlinOptions completely.
          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          # Java 17 + desugaring.
          compile_block = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
              isCoreLibraryDesugaringEnabled = true
          }"""

          s = re.sub(
              r'compileOptions\s*\{.*?\n\s*\}',
              compile_block,
              s,
              count=1,
              flags=re.S
          )

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  "android {\n    " +
                  compile_block.replace("\n", "\n    "),
                  1
              )

          # Modern Kotlin compilerOptions DSL.
          if "compilerOptions" not in s:
              s += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          # Multidex.
          if "multiDexEnabled = true" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        multiDexEnabled = true",
                  1
              )

          # Core library desugaring.
          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dep,
                      1
                  )
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"

          p.write_text(s)
          PY

      - name: Flutter Pub Get
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Flutter Test
        working-directory: photo_enhancer_4k
        run: flutter test

      - name: Flutter Clean
        working-directory: photo_enhancer_4k
        run: flutter clean

      - name: Flutter Pub Get Again
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Build Release APK
        working-directory: photo_enhancer_4k
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apks
          path: photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
