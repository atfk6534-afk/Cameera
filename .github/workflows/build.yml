name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          set -e

          if [ ! -f "photo_enhancer_4k.zip" ]; then
            echo "ERROR: photo_enhancer_4k.zip not found."
            exit 1
          fi

          rm -rf photo_enhancer_4k
          unzip -q photo_enhancer_4k.zip -d .

          test -f photo_enhancer_4k/pubspec.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: photo_enhancer_4k
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org com.lahan \
              --project-name photo_enhancer_4k \
              .
          fi

      - name: Configure Android
        working-directory: photo_enhancer_4k
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "multiDexEnabled = true" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        multiDexEnabled = true",
                  1
              )

          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n" + dependency,
                      1
                  )
              else:
                  s += "\n\ndependencies {\n" + dependency + "\n}\n"

          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Analyze
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run tests
        working-directory: photo_enhancer_4k
        run: flutter test

      - name: Clean
        working-directory: photo_enhancer_4k
        run: flutter clean

      - name: Build APK
        working-directory: photo_enhancer_4k
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apks
          path: photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
