name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MODEL_URL: https://huggingface.co/CoderViking/realesr-general-x4v3-onnx/resolve/main/realesr-general-x4v3.onnx?download=true
  MODEL_SHA256: 1940a93ee08283a0a7286183186357b1688fe9fa8ede74604b424586aaddf112

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail
          test -f photo_enhancer_4k.zip
          rm -rf photo_enhancer_4k
          unzip -q photo_enhancer_4k.zip -d .
          test -f photo_enhancer_4k/pubspec.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: photo_enhancer_4k
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.lahan \
              --project-name photo_enhancer_4k \
              .
          fi

      - name: Download offline AI model
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets/models

          curl -L --fail --retry 5 \
            -o assets/models/realesr-general-x4v3.onnx \
            "$MODEL_URL"

          echo "$MODEL_SHA256  assets/models/realesr-general-x4v3.onnx" | sha256sum -c -

          test -s assets/models/realesr-general-x4v3.onnx
          ls -lh assets/models/realesr-general-x4v3.onnx

      - name: Configure Android
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          cat >> android/gradle.properties <<'EOF'

          android.newDsl=false
          android.builtInKotlin=false
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

          python3 tool/configure_android.py

      - name: Install dependencies
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Generate app icon
        working-directory: photo_enhancer_4k
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Test
        working-directory: photo_enhancer_4k
        run: flutter test

      - name: Clean
        working-directory: photo_enhancer_4k
        run: flutter clean

      - name: Pub get after clean
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Build release APKs
        working-directory: photo_enhancer_4k
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apks
          path: photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
