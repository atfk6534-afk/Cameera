name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "photo_enhancer_4k.zip" ]; then
            echo "::error::photo_enhancer_4k.zip not found in repository root."
            exit 1
          fi

          rm -rf photo_enhancer_4k
          unzip -q photo_enhancer_4k.zip -d .

          test -f photo_enhancer_4k/pubspec.yaml || {
            echo "::error::pubspec.yaml was not found after extraction."
            exit 1
          }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Generate Android platform
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org com.lahan \
              --project-name photo_enhancer_4k \
              .
          fi

      - name: Fix Java and Kotlin JVM targets
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle.kts"

          test -f "$FILE" || {
            echo "::error::$FILE not found."
            exit 1
          }

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Multidex
          if "multiDexEnabled = true" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        multiDexEnabled = true",
                  1
              )

          # Force Java compilation to JVM 17
          compile_block = """compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
          isCoreLibraryDesugaringEnabled = true
          }"""

          pattern = r'compileOptions\s*\{.*?\n\s*\}'

          if re.search(pattern, s, flags=re.S):
              s = re.sub(
                  pattern,
                  compile_block,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n    " +
                  compile_block.replace("\n", "\n    "),
                  1
              )

          # Force Kotlin compilation to JVM 17
          kotlin_block = """kotlinOptions {
          jvmTarget = JavaVersion.VERSION_17.toString()
          }"""

          pattern_kotlin = r'kotlinOptions\s*\{.*?\n\s*\}'

          if re.search(pattern_kotlin, s, flags=re.S):
              s = re.sub(
                  pattern_kotlin,
                  kotlin_block,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n    " +
                  kotlin_block.replace("\n", "\n    "),
                  1
              )

          # Kotlin Java 17 toolchain
          if "jvmToolchain(17)" not in s:
              s += """

          kotlin {
              jvmToolchain(17)
          }
          """

          # Core library desugaring
          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  s += f"""

          dependencies {{
              {dependency}
          }}
          """

          p.write_text(s)
          PY

          echo "===== FINAL ANDROID CONFIG ====="
          sed -n '1,220p' "$FILE"

      - name: Flutter Pub Get
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Flutter Test
        working-directory: photo_enhancer_4k
        run: flutter test

      - name: Flutter Clean
        working-directory: photo_enhancer_4k
        run: flutter clean

      - name: Flutter Pub Get Again
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Build Release APK
        working-directory: photo_enhancer_4k
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apks
          path: photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
