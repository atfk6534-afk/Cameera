name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: فك الضغط
        run: |
          if [ ! -f "photo_enhancer_4k.zip" ]; then
            echo "❌ ملف photo_enhancer_4k.zip مش موجود في جذر الريبو."
            exit 1
          fi
          rm -rf photo_enhancer_4k
          unzip -q photo_enhancer_4k.zip -d .
          test -f photo_enhancer_4k/pubspec.yaml || {
            echo "❌ فك الضغط تم لكن pubspec.yaml مش موجود جوه المجلد."
            exit 1
          }

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: تثبيت أحدث Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: توليد ملفات المنصّات (android) لو مش موجودة
        working-directory: photo_enhancer_4k
        run: |
          if [ ! -d "android" ]; then
            echo "android/ مش موجود — بيتولد الآن..."
            flutter create --platforms=android --org com.lahan .
          else
            echo "android/ موجود بالفعل."
          fi

      - name: ضبط compileSdk/targetSdk + توافق AGP 9 (Legacy Kotlin)
        working-directory: photo_enhancer_4k
        run: |
          GRADLE_PROPS=android/gradle.properties
          grep -q "flutter.compileSdkVersion" "$GRADLE_PROPS" 2>/dev/null || \
            echo "flutter.compileSdkVersion=35" >> "$GRADLE_PROPS"
          grep -q "flutter.targetSdkVersion" "$GRADLE_PROPS" 2>/dev/null || \
            echo "flutter.targetSdkVersion=35" >> "$GRADLE_PROPS"
          grep -q "android.builtInKotlin" "$GRADLE_PROPS" 2>/dev/null || \
            echo "android.builtInKotlin=false" >> "$GRADLE_PROPS"
          grep -q "android.newDsl" "$GRADLE_PROPS" 2>/dev/null || \
            echo "android.newDsl=false" >> "$GRADLE_PROPS"
          echo "===== gradle.properties ====="
          cat "$GRADLE_PROPS"

      - name: تفعيل Multidex + Core Library Desugaring (مطلوبة لـ ML Kit)
        working-directory: photo_enhancer_4k
        run: |
          KTS=android/app/build.gradle.kts
          GROOVY=android/app/build.gradle

          if [ -f "$KTS" ]; then
            GRADLE="$KTS"
            if ! grep -q "multiDexEnabled" "$GRADLE"; then
              sed -i '/defaultConfig {/a\        multiDexEnabled = true' "$GRADLE"
            fi
            if ! grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE"; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$GRADLE"
            fi
            if ! grep -q "desugar_jdk_libs" "$GRADLE"; then
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$GRADLE"
            fi
          elif [ -f "$GROOVY" ]; then
            GRADLE="$GROOVY"
            if ! grep -q "multiDexEnabled" "$GRADLE"; then
              sed -i '/defaultConfig {/a\        multiDexEnabled true' "$GRADLE"
            fi
            if ! grep -q "coreLibraryDesugaringEnabled" "$GRADLE"; then
              sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$GRADLE"
            fi
            if ! grep -q "desugar_jdk_libs" "$GRADLE"; then
              printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> "$GRADLE"
            fi
          else
            echo "❌ مفيش android/app/build.gradle ولا build.gradle.kts"
            exit 1
          fi

      - name: تثبيت الباكدجات
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: توحيد Java/Kotlin Target (17) داخل كل الباكدجات مباشرة
        working-directory: photo_enhancer_4k
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "🔍 البحث في: $PUB_CACHE_DIR/hosted"

          FOUND=0
          while IFS= read -r -d '' FILE; do
            FOUND=$((FOUND + 1))
            echo "🔧 تعديل: $FILE"

            sed -i -E "s/(source|target)Compatibility[[:space:]]+JavaVersion\.VERSION_[0-9_]+/\1Compatibility JavaVersion.VERSION_17/g" "$FILE"
            sed -i -E "s/(source|target)Compatibility[[:space:]]*=[[:space:]]*JavaVersion\.VERSION_[0-9_]+/\1Compatibility = JavaVersion.VERSION_17/g" "$FILE"
            sed -i -E "s/(source|target)Compatibility[[:space:]]+[0-9]+(\.[0-9]+)?/\1Compatibility 17/g" "$FILE"
            sed -i -E "s/jvmTarget[[:space:]]*=[[:space:]]*[\"'][0-9.]+[\"']/jvmTarget = \"17\"/g" "$FILE"
          done < <(find "$PUB_CACHE_DIR/hosted" -type f \
                    \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                    -path "*/android/*" -print0 2>/dev/null)

          echo "✅ تم تعديل $FOUND ملف بنجاح"
          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ مفيش ملفات اتلقت — راجع مسار PUB_CACHE"
          fi

      - name: فحص الكود (تحذيرات بسيطة متوقفش الـ build)
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: تشغيل الاختبارات
        working-directory: photo_enhancer_4k
        run: flutter test

      - name: بناء APK (Release)
        working-directory: photo_enhancer_4k
        run: flutter build apk --release --split-per-abi

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apk
          path: photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
