name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          test -f "photo_enhancer_4k.zip"

          rm -rf photo_enhancer_4k
          unzip -q photo_enhancer_4k.zip -d .

          test -f "photo_enhancer_4k/pubspec.yaml"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          java -version
          flutter --version

      - name: Generate Android platform
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org com.lahan \
              --project-name photo_enhancer_4k \
              .
          fi

      - name: Configure Android
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          cat >> android/gradle.properties <<'EOF'

          android.newDsl=false
          android.builtInKotlin=false
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

          python3 <<'PY'
          from pathlib import Path
          import re

          # ==============================
          # APP MODULE
          # ==============================

          app = Path("android/app/build.gradle.kts")
          s = app.read_text()

          # Remove deprecated kotlinOptions
          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          # Java 17 WITHOUT options.release
          java_block = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
              isCoreLibraryDesugaringEnabled = true
          }"""

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'compileOptions\s*\{.*?\n\s*\}',
                  java_block,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n    " +
                  java_block.replace("\n", "\n    "),
                  1
              )

          # Modern Kotlin compiler DSL
          if "compilerOptions" not in s:
              s += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          # Multidex
          if "multiDexEnabled = true" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        multiDexEnabled = true",
                  1
              )

          # tflite_flutter 0.12.x
          if re.search(r'minSdk\s*=\s*[^\n]+', s):
              s = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  'minSdk = 26',
                  s,
                  count=1
              )

          # Desugaring
          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  s += (
                      "\n\ndependencies {\n    "
                      + dependency +
                      "\n}\n"
                  )

          app.write_text(s)

          # ==============================
          # ALL ANDROID SUBPROJECTS
          # ==============================

          root = Path("android/build.gradle.kts")
          r = root.read_text()

          marker = "// PHOTO_ENHANCER_JVM17_FIX"

          if marker not in r:
              r += """

          // PHOTO_ENHANCER_JVM17_FIX

          subprojects {
              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          """

              root.write_text(r)
          PY

      - name: Flutter Pub Get
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Flutter Test
        working-directory: photo_enhancer_4k
        run: flutter test

      - name: Flutter Clean
        working-directory: photo_enhancer_4k
        run: flutter clean

      - name: Clear Gradle Cache
        run: |
          rm -rf ~/.gradle/caches

      - name: Flutter Pub Get Again
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Verify JavaCompile Configuration
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          if grep -R "options\.release\.set" android \
            --include="*.gradle" \
            --include="*.gradle.kts"; then

            echo "::error::Unsupported options.release.set() detected."
            exit 1
          fi

          echo "Checking Java compatibility:"
          grep -R \
            "sourceCompatibility\|targetCompatibility" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" || true

      - name: Build Release APK
        working-directory: photo_enhancer_4k
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apks
          path: photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
