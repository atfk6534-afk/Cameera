name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: "stable"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          test -f photo_enhancer_4k.zip

          rm -rf photo_enhancer_4k
          unzip -q photo_enhancer_4k.zip -d .

          test -f photo_enhancer_4k/pubspec.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Generate Android project
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.lahan \
              --project-name photo_enhancer_4k \
              .
          fi

      - name: Configure Android
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          cat >> android/gradle.properties <<'EOF'

          android.newDsl=false
          android.builtInKotlin=false
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle.kts")
          s = app.read_text()

          # Remove deprecated kotlinOptions.
          s = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              s,
              flags=re.S
          )

          # Java 17 + desugaring.
          java_block = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
              isCoreLibraryDesugaringEnabled = true
          }"""

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'compileOptions\s*\{.*?\n\s*\}',
                  java_block,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n    " +
                  java_block.replace("\n", "\n    "),
                  1
              )

          # tflite_flutter 0.12.x requires API 26+.
          if re.search(r'minSdk\s*=\s*[^\n]+', s):
              s = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  'minSdk = 26',
                  s,
                  count=1
              )
          elif "minSdkVersion" in s:
              s = re.sub(
                  r'minSdkVersion\s*=\s*[^\n]+',
                  'minSdkVersion = 26',
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        minSdk = 26",
                  1
              )

          # Multidex.
          if "multiDexEnabled = true" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        multiDexEnabled = true",
                  1
              )

          # Modern Kotlin compiler DSL.
          if "compilerOptions" not in s:
              s += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          # Core library desugaring.
          desugar = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + desugar,
                      1
                  )
              else:
                  s += "\n\ndependencies {\n    " + desugar + "\n}\n"

          app.write_text(s)

          # IMPORTANT:
          # tflite_flutter is a separate Gradle subproject.
          # Force all JavaCompile tasks to JVM 17 without afterEvaluate.
          root = Path("android/build.gradle.kts")
          r = root.read_text()

          marker = "// PHOTO_ENHANCER_GLOBAL_JVM17_FIX"

          if marker not in r:
              r += f"""

          {marker}

          subprojects {{
              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {{
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
                  options.release.set(17)
              }}
          }}
          """

              root.write_text(r)
          PY

      - name: Resolve dependencies
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Verify plugin versions
        working-directory: photo_enhancer_4k
        shell: bash
        run: |
          set -euo pipefail

          flutter pub deps --style=compact |
            grep -E \
            'image_picker|image_picker_android|share_plus|tflite_flutter' \
            || true

      - name: Analyze
        working-directory: photo_enhancer_4k
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Test
        working-directory: photo_enhancer_4k
        run: flutter test

      - name: Clean build outputs
        working-directory: photo_enhancer_4k
        run: flutter clean

      - name: Clear Gradle caches
        shell: bash
        run: |
          rm -rf ~/.gradle/caches

      - name: Resolve dependencies again
        working-directory: photo_enhancer_4k
        run: flutter pub get

      - name: Build Release APKs
        working-directory: photo_enhancer_4k
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: photo-enhancer-4k-apks
          path: photo_enhancer_4k/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
